# Oparysh Chinila tmux config (based on original rescue tmux.conf)

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g status-style bg=colour235,fg=colour136
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=cyan]Oparysh Chinila "

# Prefix C-space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Open last link on phone
bind-key u run-shell "oparysh-chinila-qr || omarchy-rescue-qr"
# Open menu
bind-key o new-window -n menu "oparysh-chinila menu"
